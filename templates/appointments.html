{% extends "base.html" %}{% block body %}<div class="card"><h2>Book an appointment</h2>
<form method="post"><label>Doctor<select name="doctor_id" required>{% for d in doctors %}<option value="{{ d.id }}">{{ d.name }} ({{ d.department }})</option>{% endfor %}</select></label>
<label>Date<input type="date" name="date" min="{{ today }}" required></label>
<label>Time slot<select name="time">{% for s in slots %}<option>{{ s }}</option>{% endfor %}</select></label>
<label>Reason<input name="reason"></label><button>Book</button></form></div>
<div class="card"><h3>My appointments</h3><table><tr><th>Date</th><th>Time</th><th>Doctor</th><th>Status</th><th></th></tr>
{% for a in rows %}<tr><td>{{ a.date }}</td><td>{{ a.time }}</td><td>{{ a.doctor }}</td><td>{{ a.status }}</td><td>{% if a.status == 'Confirmed' %}<form class="inline" method="post" action="{{ url_for('appt_action', aid=a.id, action='cancel') }}"><button class="danger small">Cancel</button></form>{% endif %}</td></tr>
{% else %}<tr><td colspan="5" class="muted">No appointments yet.</td></tr>{% endfor %}</table></div>{% endblock %}
